 it:{house:"Pisa Paradiso Nice View è una storica casa-torre del XIV secolo, nel cuore di Pisa e affacciata sul Lungarno Pisano. La casa conserva e valorizza le pietre originali a vista dell'epoca, che testimoniano la storia e l'autenticità dell'edificio. Gli ambienti sono stati restaurati con attenzione, mantenendo il carattere storico della casa e integrandolo con il comfort contemporaneo. La posizione consente di raggiungere comodamente a piedi i principali luoghi di interesse della città.",saffi:"Aurelio Saffi (Forlì, 1819 – San Varano, Forlì, 1890) fu patriota, scrittore e uomo politico del Risorgimento. Fu tra i protagonisti della Repubblica Romana del 1849, insieme a Giuseppe Mazzini e Carlo Armellini. La tradizione storica della casa racconta che Saffi fu ospite dell'abitazione: questa memoria è presentata nella guida come parte della storia della casa.",yambo:"Enrico Novelli, conosciuto con lo pseudonimo Yambo, nacque a Pisa il 5 giugno 1874. Scrittore, giornalista, illustratore e autore di libri d'avventura e per ragazzi, è ricordato anche per Ciuffettino ed è considerato un antesignano dei libri di fantascienza italiana. Secondo la storia della casa fornita dalla proprietà, Yambo nacque proprio nell'abitazione di Lungarno Mediceo 23. La biografia generale è documentata dalle fonti storiche; il legame specifico con questa casa è riportato come memoria storica della proprietà."},
 lt:{house:"Pisa Paradiso Nice View yra istorinis XIV amžiaus bokšto tipo namas Pizos centre, prie Lungarno Pisano. Name išsaugotas ir išryškintas originalus to laikotarpio atviras mūras, atskleidžiantis pastato istoriją ir autentiškumą. Interjeras kruopščiai restauruotas, derinant istorinį charakterį su šiuolaikiniu komfortu. Iš čia pagrindines Pizos lankytinas vietas patogu pasiekti pėsčiomis.",saffi:"Aurelio Saffi (Forlì, 1819–San Varano, Forlì, 1890) buvo Italijos Risorgimento patriotas, rašytojas ir politikas. Jis buvo vienas svarbiausių 1849 m. Romos Respublikos veikėjų kartu su Giuseppe Mazzini ir Carlo Armellini. Namų istorinėje tradicijoje nurodoma, kad Saffi buvo šių namų svečias; gidas šį ryšį pateikia kaip namo istorijos dalį.",yambo:"Enrico Novelli, žinomas Yambo slapyvardžiu, gimė Pizoje 1874 m. birželio 5 d. Jis buvo rašytojas, žurnalistas, iliustratorius ir nuotykių bei vaikų knygų autorius, taip pat žinomas dėl „Ciuffettino“; jis laikomas italų mokslinės fantastikos knygų pirmtaku. Pagal savininko pateiktą namo istoriją Yambo gimė šiame name, Lungarno Mediceo 23. Bendrą biografiją patvirtina istoriniai šaltiniai, o konkretus ryšys su šiuo namu pateikiamas kaip šeimos istorijos tradicija."},
 nl:{house:"Pisa Paradiso Nice View bevindt zich in een historisch 14e-eeuws torenhuis in het hart van Pisa, aan de Lungarno Pisano. Het huis heeft origineel zichtbaar metselwerk uit die periode behouden en benadrukt daarmee de geschiedenis en het authentieke karakter van het gebouw. De interieurs zijn zorgvuldig gerestaureerd en combineren het historische karakter met modern comfort. De belangrijkste bezienswaardigheden van Pisa zijn gemakkelijk te voet bereikbaar.",saffi:"Aurelio Saffi (Forlì, 1819–San Varano, Forlì, 1890) was een Italiaanse patriot, schrijver en politicus van het Risorgimento. Hij was een van de belangrijkste figuren van de Romeinse Republiek van 1849, samen met Giuseppe Mazzini en Carlo Armellini. Volgens de historische traditie van het huis was Saffi hier te gast; de gids presenteert deze band als onderdeel van de geschiedenis van het huis.",yambo:"Enrico Novelli, bekend onder het pseudoniem Yambo, werd op 5 juni 1874 in Pisa geboren. Hij was schrijver, journalist, illustrator en auteur van avonturen- en kinderboeken, onder meer bekend van Ciuffettino, en wordt beschouwd als een voorloper van Italiaanse sciencefictionboeken. Volgens de door de eigenaar verstrekte geschiedenis van het huis werd Yambo geboren in deze woning aan de Lungarno Mediceo 23. Zijn algemene biografie is gedocumenteerd door historische bronnen; de specifieke band met dit huis wordt als onderdeel van de familiegeschiedenis gepresenteerd."},
 en:{house:"Pisa Paradiso Nice View is a historic 14th-century tower house in the heart of Pisa, overlooking the Lungarno Pisano. The house preserves and showcases original exposed stonework from the period, reflecting the history and authentic character of the building. The interiors have been carefully restored, combining the historic character of the home with contemporary comfort. Its central position makes Pisa's main sights easy to reach on foot.",saffi:"Aurelio Saffi (Forlì, 1819 – San Varano, Forlì, 1890) was an Italian patriot, writer and politician of the Risorgimento. He was one of the leading figures of the Roman Republic of 1849, together with Giuseppe Mazzini and Carlo Armellini. The house's historical tradition records Saffi as a guest of this home; the guide presents that connection as part of the property's history.",yambo:"Enrico Novelli, known by the pen name Yambo, was born in Pisa on 5 June 1874. He was a writer, journalist, illustrator and author of adventure and children's books, remembered also for Ciuffettino, and is considered a forerunner of Italian science-fiction books. According to the property's historical account, Yambo was born in the home at Lungarno Mediceo 23. His general biography is documented by historical sources; the specific connection with this house is presented as the property's historical memory."}

Object.assign(STORY,{
fr:{house:"Pisa Paradiso Nice View est une maison-tour historique du XIVe siècle, au cœur de Pise, donnant sur le Lungarno Pisano. La maison conserve et met en valeur les pierres apparentes d’origine de cette époque, qui témoignent de l’histoire et du caractère authentique du bâtiment. Les intérieurs ont été soigneusement restaurés, en conservant le caractère historique de la maison tout en l’associant au confort contemporain. Sa situation centrale permet de rejoindre facilement à pied les principaux sites de Pise.",saffi:"Aurelio Saffi (Forlì, 1819 – San Varano, Forlì, 1890) fut un patriote, écrivain et homme politique du Risorgimento italien. Il fut l’une des figures de la République romaine de 1849, avec Giuseppe Mazzini et Carlo Armellini. Selon la tradition historique de la maison, Saffi y fut l’un des hôtes ; ce lien est présenté dans le guide comme faisant partie de l’histoire de la propriété.",yambo:"Enrico Novelli, connu sous le pseudonyme Yambo, est né à Pise le 5 juin 1874. Écrivain, journaliste, illustrateur et auteur de livres d’aventures et pour la jeunesse, il est notamment connu pour Ciuffettino et considéré comme un précurseur des livres de science-fiction italiens. Selon l’histoire de la maison fournie par la propriété, Yambo est né dans cette demeure du Lungarno Mediceo 23. Sa biographie générale est documentée par des sources historiques ; le lien précis avec cette maison est présenté comme une mémoire historique de la propriété."},
de:{house:"Pisa Paradiso Nice View ist ein historisches Turmhaus aus dem 14. Jahrhundert im Herzen von Pisa mit Blick auf den Lungarno Pisano. Das Haus bewahrt und zeigt originales sichtbares Mauerwerk aus dieser Zeit, das die Geschichte und den authentischen Charakter des Gebäudes widerspiegelt. Die Innenräume wurden sorgfältig restauriert und verbinden den historischen Charakter des Hauses mit modernem Komfort. Dank der zentralen Lage sind die wichtigsten Sehenswürdigkeiten von Pisa bequem zu Fuß erreichbar.",saffi:"Aurelio Saffi (Forlì, 1819 – San Varano, Forlì, 1890) war ein italienischer Patriot, Schriftsteller und Politiker des Risorgimento. Gemeinsam mit Giuseppe Mazzini und Carlo Armellini gehörte er zu den führenden Persönlichkeiten der Römischen Republik von 1849. Nach der historischen Überlieferung des Hauses war Saffi hier zu Gast; dieser Bezug wird im Guide als Teil der Geschichte der Immobilie dargestellt.",yambo:"Enrico Novelli, bekannt unter dem Pseudonym Yambo, wurde am 5. Juni 1874 in Pisa geboren. Er war Schriftsteller, Journalist, Illustrator und Autor von Abenteuer- und Kinderbüchern, ist auch für Ciuffettino bekannt und gilt als Wegbereiter der italienischen Science-Fiction-Literatur. Nach der von der Eigentümerseite überlieferten Geschichte des Hauses wurde Yambo in diesem Gebäude am Lungarno Mediceo 23 geboren. Seine allgemeine Biografie ist durch historische Quellen dokumentiert; der konkrete Bezug zu diesem Haus wird als historische Erinnerung der Eigentümer dargestellt."},
es:{house:"Pisa Paradiso Nice View es una histórica casa-torre del siglo XIV, en el corazón de Pisa y con vistas al Lungarno Pisano. La casa conserva y muestra la piedra vista original de la época, que refleja la historia y el carácter auténtico del edificio. Los interiores han sido cuidadosamente restaurados, combinando el carácter histórico de la vivienda con el confort contemporáneo. Su ubicación céntrica permite llegar fácilmente a pie a los principales lugares de interés de Pisa.",saffi:"Aurelio Saffi (Forlì, 1819 – San Varano, Forlì, 1890) fue un patriota, escritor y político italiano del Risorgimento. Fue una de las figuras principales de la República Romana de 1849, junto con Giuseppe Mazzini y Carlo Armellini. Según la tradición histórica de la casa, Saffi fue huésped de esta vivienda; la guía presenta este vínculo como parte de la historia de la propiedad.",yambo:"Enrico Novelli, conocido por el seudónimo Yambo, nació en Pisa el 5 de junio de 1874. Fue escritor, periodista, ilustrador y autor de libros de aventuras y para jóvenes; también es recordado por Ciuffettino y considerado un precursor de los libros de ciencia ficción italianos. Según la historia de la casa proporcionada por la propiedad, Yambo nació en esta vivienda de Lungarno Mediceo 23. Su biografía general está documentada por fuentes históricas; el vínculo específico con esta casa se presenta como memoria histórica de la propiedad."},
pl:{house:"Pisa Paradiso Nice View to zabytkowy dom-wieża z XIV wieku, położony w sercu Pizy nad Lungarno Pisano. Dom zachowuje i eksponuje oryginalne odsłonięte mury z tego okresu, świadczące o historii i autentycznym charakterze budynku. Wnętrza zostały starannie odrestaurowane, łącząc historyczny charakter domu ze współczesnym komfortem. Centralne położenie pozwala łatwo dotrzeć pieszo do najważniejszych atrakcji Pizy.",saffi:"Aurelio Saffi (Forlì, 1819 – San Varano, Forlì, 1890) był włoskim patriotą, pisarzem i politykiem Risorgimenta. Był jedną z najważniejszych postaci Republiki Rzymskiej z 1849 roku, obok Giuseppe Mazziniego i Carla Armelliniego. Według tradycji historycznej domu Saffi był jego gościem; przewodnik przedstawia ten związek jako część historii nieruchomości.",yambo:"Enrico Novelli, znany pod pseudonimem Yambo, urodził się w Pizie 5 czerwca 1874 roku. Był pisarzem, dziennikarzem, ilustratorem i autorem książek przygodowych oraz dla młodzieży; znany jest również z Ciuffettino i uważany za prekursora włoskiej literatury science fiction. Według historii domu przekazanej przez właścicieli Yambo urodził się w tym budynku przy Lungarno Mediceo 23. Jego ogólna biografia jest udokumentowana w źródłach historycznych; szczególny związek z tym domem przedstawiany jest jako historyczna pamięć właścicieli."},
zh:{house:"Pisa Paradiso Nice View 是一座历史悠久的十四世纪塔楼住宅，位于比萨市中心，俯瞰比萨阿诺河沿岸。住宅保留并展示了这一时期的原始裸露石墙，体现了建筑的历史与真实特色。室内经过精心修复，在保留历史风格的同时融入现代舒适设施。住宅位置中心，步行即可方便抵达比萨的主要景点。",saffi:"Aurelio Saffi（福尔利，1819年－圣瓦拉诺，福尔利，1890年）是意大利复兴运动时期的爱国者、作家和政治人物。他与朱塞佩·马志尼和卡洛·阿尔梅利尼一起，是1849年罗马共和国的重要人物。根据这座房屋的历史传统，Saffi 曾是这里的客人；本指南将这一联系作为房屋历史的一部分呈现。",yambo:"Enrico Novelli，笔名 Yambo，1874年6月5日出生于比萨。他是作家、记者、插画家以及冒险和儿童读物作者，也因《Ciuffettino》而闻名，并被认为是意大利科幻小说的先驱之一。根据房产方提供的房屋历史，Yambo 出生于 Lungarno Mediceo 23 号的这座住宅中。他的总体生平由历史资料记载；与这座房屋的具体联系则作为房产历史记忆呈现。"}

lt:{miracoli:"Didžiojoje Pizos monumentalioje aikštėje susitelkia Bokštas, Katedra, Krikštykla ir Camposanto. Skirkite laiko pasigrožėti marmuru, perspektyvomis ir aikštės šviesa.",lungarni:"Atraskite Pizą pėsčiomis palei Arno upę, tarp tiltų ir fasadų prie upės. Ramus pasivaikščiojimas ypač malonus vėlyvos popietės šviesoje.",scotto:"Sodas, įsikūręs istorinių miesto įtvirtinimų apsuptyje. Tai žalia poilsio vieta, kurią galima derinti su pasivaikščiojimu palei upę, taip pat su vaikais.",botanico:"Atraskite Pizos universiteto augalų kolekcijas ir botanikos kultūrą. Sodo ir muziejaus darbo laiką atskirai patikrinkite oficialioje svetainėje."},
de:{miracoli:"Auf dem großen monumentalen Platz von Pisa befinden sich der Turm, die Kathedrale, das Baptisterium und der Camposanto. Nehmen Sie sich Zeit, den Marmor, die Perspektiven und das Licht auf dem Platz zu genießen.",lungarni:"Entdecken Sie Pisa zu Fuß entlang des Arno, zwischen Brücken und Fassaden am Fluss. Ein entspannter Spaziergang, besonders im Licht des späten Nachmittags.",scotto:"Ein Garten innerhalb der historischen Stadtbefestigungen. Eine grüne Pause, die sich gut mit einem Spaziergang am Fluss verbinden lässt, auch mit Kindern.",botanico:"Entdecken Sie die Pflanzensammlungen und die botanische Kultur der Universität Pisa. Öffnungszeiten von Garten und Museum bitte separat auf der offiziellen Website prüfen."},
es:{miracoli:"La gran plaza monumental de Pisa reúne la Torre, la Catedral, el Baptisterio y el Camposanto. Tómese tiempo para disfrutar del mármol, las perspectivas y la luz de la plaza.",lungarni:"Descubra Pisa a pie a lo largo del Arno, entre puentes y fachadas junto al río. Un paseo tranquilo, especialmente agradable con la luz de la tarde.",scotto:"Un jardín dentro de las históricas fortificaciones de la ciudad. Un descanso verde que puede combinarse con un paseo junto al río, también con niños.",botanico:"Descubra las colecciones de plantas y la cultura botánica de la Universidad de Pisa. Consulte por separado los horarios de apertura del jardín y del museo en el sitio oficial."},
pl:{miracoli:"Wielki monumentalny plac Pizy skupia Wieżę, Katedrę, Baptysterium i Camposanto. Warto zatrzymać się, aby podziwiać marmur, perspektywę i światło na placu.",lungarni:"Odkrywaj Pizę pieszo wzdłuż Arno, między mostami i fasadami nad rzeką. Spokojny spacer jest szczególnie przyjemny w świetle późnego popołudnia.",scotto:"Ogród położony w obrębie historycznych fortyfikacji miasta. Zielone miejsce odpoczynku, które można połączyć ze spacerem nad rzeką, także z dziećmi.",botanico:"Odkryj kolekcje roślin i kulturę botaniczną Uniwersytetu w Pizie. Godziny otwarcia ogrodu i muzeum sprawdź osobno na oficjalnej stronie."},
nl:{miracoli:"Op het grote monumentale plein van Pisa staan de Toren, de Kathedraal, het Baptisterium en de Camposanto bij elkaar. Neem de tijd om het marmer, de perspectieven en het licht op het plein te bewonderen.",lungarni:"Ontdek Pisa te voet langs de Arno, tussen bruggen en gevels aan de rivier. Geniet van een ontspannen wandeling, vooral in het licht van de late namiddag.",scotto:"Een tuin binnen de historische stadsversterkingen. Een groene pauze die goed te combineren is met een wandeling langs de rivier, ook met kinderen.",botanico:"Ontdek de plantencollecties en de botanische cultuur van de Universiteit van Pisa. Controleer de openingstijden van tuin en museum afzonderlijk op de officiële website."}
};

function link(url,text){
  const safe=esc(text);
  const m=safe.match(/^(\p{Extended_Pictographic}(?:\uFE0F)?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F)?)*)\s*(.*)$/u);
  const label=m?`<span class=\"emoji-action\" aria-hidden=\"true\">${m[1]}</span>${m[2]}`:safe;
  return `<a class=\"btn\" href=\"${esc(url)}\" target=\"_blank\" rel=\"noopener noreferrer\">${label} ↗</a>`
}

function applyFixedTranslations(){
  const dict=FIXED_I18N[lang]||{};
  const keys=Object.keys(dict).filter(k=>k&&dict[k]!==k).sort((a,b)=>b.length-a.length);
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    let v=n.nodeValue;
    for(const k of keys){ if(v.includes(k)) v=v.split(k).join(dict[k]); }
    n.nodeValue=v;
  });
  document.documentElement.lang=lang;
}

function applyEmojiSizing(){
  const re=/^(\p{Extended_Pictographic}(?:\uFE0F)?(?:\u200D\p{Extended_Pictographic}(?:\uFE0F)?)*)\s*/u;
  document.querySelectorAll('.quick a.btn,.quick button.btn,h3,.eyebrow,.menu-card .mi,.visual-art').forEach(el=>{
    if(el.querySelector('.emoji-action')) return;
    const node=el.firstChild;
    if(!node || node.nodeType!==Node.TEXT_NODE) return;
    const m=node.nodeValue.match(re); if(!m) return;
    const span=document.createElement('span'); span.className='emoji-action'; span.setAttribute('aria-hidden','true'); span.textContent=m[1];
    node.nodeValue=node.nodeValue.slice(m[0].length); el.insertBefore(span,node);
  });
}

<section class="section page-section" id="house" hidden><button class="btn back" data-section="home">← Home</button><div class="story-card"><div class="eyebrow">PISA PARADISO NICE VIEW</div><h2>${navText('house')}</h2><p>${esc(storyText('house'))}</p><details><summary>${navText('saffi')}</summary><p>${esc(storyText('saffi'))}</p></details><details><summary>${navText('yambo')}</summary><p>${esc(storyText('yambo'))}</p></details></div></section>
<section class="section page-section" id="saffi" hidden><button class="btn back" data-section="home">← Home</button><div class="story-card"><h2>${navText('saffi')}</h2><p>${esc(storyText('saffi'))}</p><p class="price-note">La biografia generale è verificabile tramite fonti storiche; il soggiorno nella casa è riportato dalla proprietà.</p>${link('https://www.treccani.it/enciclopedia/aurelio-saffi/','Biografia Treccani')}</div></section>
<section class="section page-section" id="yambo" hidden><button class="btn back" data-section="home">← Home</button><div class="story-card"><h2>${navText('yambo')}</h2><p>${esc(storyText('yambo'))}</p><p class="price-note">La nascita a Pisa è documentata; la nascita nell'appartamento è indicata dalla storia della proprietà.</p>${link('https://www.treccani.it/enciclopedia/enrico-novelli_%28Dizionario-Biografico%29/','Biografia Treccani')}</div></section>
<section class="section page-section" id="events" hidden><button class="btn back" data-section="home">← Home</button><h2>${navText('events')}</h2><div class="ticket-card"><p>Consulta gli eventi aggiornati del Comune e del turismo di Pisa.</p>${link('https://www.turismo.pisa.it/eventi/index.html','🇮🇹 Eventi Pisa')}${link('https://www.turismo.pisa.it/en/events','🇬🇧 Pisa events')}</div></section>
<section class="section page-section" id="ztl" hidden><button class="btn back" data-section="home">← Home</button><h2>${navText('ztl')}</h2><div class="ticket-card"><p>Prima di entrare in centro con l'auto, verifica sempre le fasce orarie e le regole di accesso alla ZTL.</p>${link('https://www.comune.pisa.it/it/ufficio/ztl','🌐 Comune di Pisa')}</div></section>
<section class="section page-section" id="useful" hidden><button class="btn back" data-section="home">← Home</button><h2>${navText('useful')}</h2><div class="visual-grid"><article class="ticket-card"><h3>🚨 112</h3><p>Numero unico europeo per le emergenze.</p></article><article class="ticket-card"><h3>🚕 Co.Ta.Pi.</h3><p>RadioTaxi Pisa: 050 541600.</p>${link('https://www.cotapi.it/','Co.Ta.Pi.')}</article><article class="ticket-card"><h3>🏛️ Turismo Pisa</h3><p>Informazioni turistiche ed eventi.</p>${link('https://www.turismo.pisa.it/','Turismo Pisa')}</article></div></section>`;renderCards();const wanted=(location.hash||'#home').slice(1);showSection(document.getElementById(wanted)?wanted:'home');applyFixedTranslations();applyEnglishContent();applyPisaMoverTranslation();applyResidualUiTranslations();applyEmojiSizing()}
function openPlace(id,show=true){const p=PLACES.find(p=>p.id===id);if(!p)return;active=id;$('#detail').innerHTML=`<button class="close" data-action="close">${t('close')} ×</button><span class="pill">${t(p.category)}</span><h2>${esc(p.name)}</h2><p id="narration">${esc((PLACE_I18N[lang]?.[p.id]||PLACE_GENERIC_I18N[lang]?.[p.id]||p.description[lang]||p.description.en||p.description.it))}</p><p class="note">${t('check')}</p><div class="actions">${link(maps(p.query),t('maps'))}${link(route(p.query),t('directions'))}${link(p.site,t('website'))}</div><hr>${audio()}${p.images.length?`<div class="gallery">${p.images.map(src=>`<img loading="lazy" src="${esc(src)}" alt="${esc(p.name)}">`).join('')}</div>`:''}${p.video?link(p.video,'▶ Video'):''}`;if(show&&!$('#detail').open)$('#detail').showModal()}
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){category=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b===f));renderCards()}const p=e.target.closest('[data-place]');if(p)openPlace(p.dataset.place);const sec=e.target.closest('[data-section]');if(sec){e.preventDefault();const id=sec.dataset.section;showSection(id);$('#nav').hidden=true;$('#menu').setAttribute('aria-expanded','false')}const a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='close')$('#detail').close();if(a.dataset.action==='listen')speak($('#narration').textContent);if(a.dataset.action==='stop')stop();if(a.dataset.action==='pause'&&'speechSynthesis'in window){speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause()}}});
$('#menu').addEventListener('click',()=>{$('#nav').hidden=!$('#nav').hidden;$('#menu').setAttribute('aria-expanded',String(!$('#nav').hidden))});window.addEventListener('hashchange',()=>{const id=(location.hash||'#home').slice(1);if(document.getElementById(id))showSection(id)});$('#language').addEventListener('change',e=>{stop();lang=e.target.value;try{localStorage.setItem('pisa-language',lang)}catch(e){}render()});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;renderCards()}});$('#detail').addEventListener('close',()=>{active=null;stop()});window.addEventListener('pagehide',stop);render();
</script>
</body></html>
