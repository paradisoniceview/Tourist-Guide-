<section class="section" id="parking-info"><h2>${t('parking')}</h2><div class="feature"><h3>SABA Vittorio Emanuele II</h3><p>${t('ztl')}</p><div class="actions">${link(maps('SABA Vittorio Emanuele II Pisa'),t('maps'))}${link('https://parclick.it/parcheggio-pisa/saba_piazza_vittorio_emanuele_ii',t('book'))}</div><p class="note">${t('check')}</p></div></section>
<section class="section" id="house"><div class="house"><div class="eyebrow">PISA PARADISO NICE VIEW</div><h2>${t('house')}</h2>${CONFIG.houseImages.map(src=>`<img loading="lazy" style="width:100%;border-radius:12px" alt="Pisa Paradiso Nice View" src="${esc(src)}">`).join('')}<p>${esc(CONFIG.houseStory[lang]||t('missing'))}</p>${CONFIG.homeAddress?link(maps(CONFIG.homeAddress),t('maps')):''}${[['history','houseStory'],['Aurelio Saffi','saffiStory'],['Enrico Novelli “Yambo”','yamboStory']].map(([title,key])=>`<details><summary>${UI[lang][title]||title}</summary><p>${esc(CONFIG[key][lang]||t('missing'))}</p></details>`).join('')}</div></section><section class="section"><div class="actions">${link(maps('Pisa Italia'),t('citymap'))}</div></section>`;renderCards();if(active)openPlace(active,false)}
function openPlace(id,show=true){const p=PLACES.find(p=>p.id===id);if(!p)return;active=id;$('#detail').innerHTML=`<button class="close" data-action="close">${t('close')} ×</button><span class="pill">${t(p.category)}</span><h2>${esc(p.name)}</h2><p id="narration">${esc(p.description[lang])}</p><p class="note">${t('check')}</p><div class="actions">${link(maps(p.query),t('maps'))}${link(route(p.query),t('directions'))}${link(p.site,t('website'))}</div><hr>${audio()}${p.images.length?`<div class="gallery">${p.images.map(src=>`<img loading="lazy" src="${esc(src)}" alt="${esc(p.name)}">`).join('')}</div>`:''}${p.video?link(p.video,'▶ Video'):''}`;if(show&&!$('#detail').open)$('#detail').showModal()}
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){category=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b===f));renderCards()}const p=e.target.closest('[data-place]');if(p)openPlace(p.dataset.place);const a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='close')$('#detail').close();if(a.dataset.action==='listen')speak($('#narration').textContent);if(a.dataset.action==='stop')stop();if(a.dataset.action==='pause'&&'speechSynthesis'in window){speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause()}}if(e.target.closest('#nav a')){$('#nav').hidden=true;$('#menu').setAttribute('aria-expanded','false')}});
$('#menu').addEventListener('click',()=>{$('#nav').hidden=!$('#nav').hidden;$('#menu').setAttribute('aria-expanded',String(!$('#nav').hidden))});$('#language').addEventListener('change',e=>{stop();lang=e.target.value;try{localStorage.setItem('pisa-language',lang)}catch(e){}render()});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;renderCards()}});$('#detail').addEventListener('close',()=>{active=null;stop()});window.addEventListener('pagehide',stop);render();
</script></body></html>
