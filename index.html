 it:{house:"Pisa Paradiso Nice View è una storica casa-torre del XIV secolo, nel cuore di Pisa e affacciata sul Lungarno Pisano. La casa conserva e valorizza le pietre originali a vista dell'epoca, che testimoniano la storia e l'autenticità dell'edificio. Gli ambienti sono stati restaurati con attenzione, mantenendo il carattere storico della casa e integrandolo con il comfort contemporaneo. La posizione consente di raggiungere comodamente a piedi i principali luoghi di interesse della città.",saffi:"Aurelio Saffi (Forlì, 1819 – San Varano, Forlì, 1890) fu patriota, scrittore e uomo politico del Risorgimento. Fu tra i protagonisti della Repubblica Romana del 1849, insieme a Giuseppe Mazzini e Carlo Armellini. La tradizione storica della casa racconta che Saffi fu ospite dell'abitazione: questa memoria è presentata nella guida come parte della storia della casa.",yambo:"Enrico Novelli, conosciuto con lo pseudonimo Yambo, nacque a Pisa il 5 giugno 1874. Scrittore, giornalista, illustratore e autore di libri d'avventura e per ragazzi, è ricordato anche per Ciuffettino ed è considerato un antesignano dei libri di fantascienza italiana. Secondo la storia della casa fornita dalla proprietà, Yambo nacque proprio nell'abitazione di Lungarno Mediceo 23. La biografia generale è documentata dalle fonti storiche; il legame specifico con questa casa è riportato come memoria storica della proprietà."},

function renderCards(){const list=PLACES.filter(p=>p.category!=='parking'&&(category==='all'||p.category===category)&&(p.name+' '+p.description[lang]).toLocaleLowerCase(lang).includes(search.toLocaleLowerCase(lang)));$('#cards').innerHTML=list.length?list.map(p=>`<article class="card"><div class="art" aria-hidden="${!p.images.length}">${image(p)}</div><div class="card-body"><span class="pill">${t(p.category)}</span><h3>${esc(p.name)}</h3><p>${esc(p.description[lang])}</p><button data-place="${p.id}">${t('more')} →</button></div></article>`).join(''):`<p role="status">${t('empty')}</p>`}
const NAV={it:{explore:'Esplora Pisa',family:'Pisa con bambini',food:'Ristoranti',parking:'Parcheggi',museums:'Musei',tickets:'Compra biglietti monumenti',transport:'Compra biglietto treno / autobus',taxi:'Prenota un taxi',airport:'Come arrivare dall’aeroporto',car:'Come arrivare in auto',house:'Storia della casa',saffi:'Aurelio Saffi',yambo:'Enrico Novelli “Yambo”',events:'Eventi',ztl:'ZTL',useful:'Numeri utili'},en:{explore:'Explore Pisa',family:'Pisa with children',food:'Restaurants',parking:'Parking',museums:'Museums',tickets:'Buy monument tickets',transport:'Buy train / bus tickets',taxi:'Book a taxi',airport:'Arriving from Pisa Airport',car:'Arriving by car',house:'History of the house',saffi:'Aurelio Saffi',yambo:'Enrico Novelli “Yambo”',events:'Events',ztl:'ZTL',useful:'Useful numbers'},fr:{explore:'Explorer Pise',family:'Pise avec les enfants',food:'Restaurants',parking:'Parkings',museums:'Musées',tickets:'Acheter des billets',transport:'Billets train / bus',taxi:'Réserver un taxi',airport:'Depuis l’aéroport de Pise',car:'Arriver en voiture',house:'Histoire de la maison',saffi:'Aurelio Saffi',yambo:'Enrico Novelli « Yambo »',events:'Événements',ztl:'ZTL',useful:'Numéros utiles'},de:{explore:'Pisa entdecken',family:'Pisa mit Kindern',food:'Restaurants',parking:'Parkplätze',museums:'Museen',tickets:'Tickets kaufen',transport:'Zug / Bus Tickets',taxi:'Taxi buchen',airport:'Vom Flughafen Pisa',car:'Anreise mit dem Auto',house:'Geschichte des Hauses',saffi:'Aurelio Saffi',yambo:'Enrico Novelli „Yambo“',events:'Veranstaltungen',ztl:'ZTL',useful:'Nützliche Nummern'},es:{explore:'Explorar Pisa',family:'Pisa con niños',food:'Restaurantes',parking:'Aparcamientos',museums:'Museos',tickets:'Comprar entradas',transport:'Billetes tren / autobús',taxi:'Reservar un taxi',airport:'Desde el aeropuerto de Pisa',car:'Llegar en coche',house:'Historia de la casa',saffi:'Aurelio Saffi',yambo:'Enrico Novelli «Yambo»',events:'Eventos',ztl:'ZTL',useful:'Números útiles'},pl:{explore:'Odkryj Pisę',family:'Piza z dziećmi',food:'Restauracje',parking:'Parkingi',museums:'Muzea',tickets:'Kup bilety',transport:'Bilety kolej / autobus',taxi:'Zarezerwuj taksówkę',airport:'Z lotniska w Pizie',car:'Dojazd samochodem',house:'Historia domu',saffi:'Aurelio Saffi',yambo:'Enrico Novelli „Yambo”',events:'Wydarzenia',ztl:'ZTL',useful:'Przydatne numery'},zh:{explore:'探索比萨',family:'亲子比萨',food:'餐厅',parking:'停车',museums:'博物馆',tickets:'购买古迹门票',transport:'购买火车 / 巴士票',taxi:'预订出租车',airport:'从比萨机场到达',car:'驾车到达',house:'房屋历史',saffi:'Aurelio Saffi',yambo:'Enrico Novelli “Yambo”',events:'活动',ztl:'ZTL',useful:'实用电话'}};
function navText(k){return (NAV[lang]&&NAV[lang][k])||NAV.it[k]}
function storyText(k){return (STORY[lang]&&STORY[lang][k])||STORY.it[k]}
function visualMuseums(){return PLACES.filter(p=>p.category==='museum').map((p,i)=>`<article class="visual-card"><div class="visual-art">${['🏛️','🎨','🧭','📜','⚓','🌿','🔬','🖼️'][i%8]}</div><div class="visual-body"><span class="pill">${t('museum')}</span><h3>${esc(p.name)}</h3><p>${esc(p.description[lang])}</p><div class="actions"><button data-place="${p.id}">${t('more')} →</button>${link(maps(p.query),t('maps'))}</div></div></article>`).join('')}
function showSection(id,writeHash=true){const target=document.getElementById(id)||document.getElementById('home');document.querySelectorAll('.page-section').forEach(sec=>sec.hidden=sec!==target);if(target.id==='explore')renderCards();if(writeHash)history.replaceState(null,'','#'+target.id);window.scrollTo({top:0,behavior:'smooth'})}
window.addEventListener('hashchange',()=>showSection((location.hash||'#home').slice(1),false));
function render(){document.documentElement.lang=lang;$('#language').value=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));const navs=[['home','explore','🧭'],['explore','explore','🗺️'],['museums','museums','🏛️'],['children','family','👨‍👩‍👧'],['restaurants','food','🍝'],['parking-info','parking','🚗'],['airport','airport','✈️'],['car','car','🚘'],['taxi','taxi','🚕'],['tickets','tickets','🎟️'],['transport','transport','🚆'],['house','house','🏠'],['saffi','saffi','📜'],['yambo','yambo','✒️'],['events','events','📅'],['ztl','ztl','🚫'],['useful','useful','☎️']];$('#nav').innerHTML=navs.map(([id,k,ico])=>`<a class="btn" href="#${id}" data-section="${id}">${ico} ${navText(k)}</a>`).join('');$('#main').innerHTML=`
<section class="hero page-section" id="home"><img src="${esc(CONFIG.heroImage)}" alt="Pisa · Lungarni" onerror="this.hidden=true"><div class="hero-content"><div class="eyebrow">Pisa Paradiso Nice View</div><h1>${t('hero')}</h1><p>${t('subtitle')}</p><a class="btn" href="#explore">${t('explore')} ↓</a></div></section>
<section class="section page-section" id="explore" hidden><div class="eyebrow">PISA · TOSCANA</div><h2>${t('tagline')}</h2><input id="search" type="search" placeholder="${t('search')}" value="${esc(search)}"><div class="filters">${['all','monument','museum','church','park'].map(k=>`<button data-filter="${k}" aria-pressed="${category===k}">${t(k)}</button>`).join('')}</div><div id="cards" class="grid"></div></section>
<section class="section page-section" id="museums" hidden><button class="btn back" data-section="home">← Home</button><button class="btn back" data-section="home">← ${navText('explore')}</button><div class="eyebrow">PISA · MUSEI</div><h2>${navText('museums')}</h2><p class="note">Una panoramica visuale dei principali musei inseriti nella guida. Tocca una scheda per dettagli, percorso e sito ufficiale.</p><div class="visual-grid">${visualMuseums()}</div></section>
<section class="section page-section" id="children" hidden><button class="btn back" data-section="home">← Home</button><h2>${t('family')}</h2><div class="grid">${[['two',['Lungarni','Giardino Scotto']],['half',['Piazza dei Miracoli','Orto e Museo Botanico']],['day',['Piazza dei Miracoli','Lungarni','Giardino Scotto']]].map(([k,list])=>`<article class="route"><span class="pill">${t(k)}</span><h3>${list[0]}</h3><p>${list.join(' → ')}</p>${link(route(list[0]+' Pisa'),t('directions'))}</article>`).join('')}</div></section>
<section class="section page-section" id="restaurants" hidden><button class="btn back" data-section="home">← Home</button><div class="feature"><h2>${t('food')}</h2><p>${t('foodnote')}</p>${link(maps('ristoranti Pisa'),t('maps'))}</div></section>
<section class="section page-section" id="parking-info" hidden><button class="btn back" data-section="home">← Home</button><h2>${t('parking')}</h2><div class="visual-grid"><article class="ticket-card"><h3>🅿️ SABA Vittorio Emanuele II</h3><p>Parcheggio coperto vicino al centro.</p><div class="actions">${link(maps('SABA Vittorio Emanuele II Pisa'),t('maps'))}${link('https://parclick.it/parcheggio-pisa/saba_piazza_vittorio_emanuele_ii',t('book'))}</div></article><article class="ticket-card"><h3>🅿️ Lungarno Guadalongo</h3><p>Strisce blu – Zona B. <strong>€0,75/ora</strong>, feriali 08:00–17:00.</p>${link(maps('Lungarno Guadalongo Pisa'),t('maps'))}</article><article class="ticket-card"><h3>🅿️ Strisce blu sui Lungarni</h3><p>Buozzi, Fibonacci, Simonelli e Sonnino – Zona A2: <strong>€1,60/ora</strong>, feriali 08:00–20:00.</p><p>Lungarni Mediceo, Pacinotti e Galilei – Zona A3: prima ora <strong>€2,50</strong>, dalla seconda <strong>€3,50</strong>; primi 20 minuti gratuiti.</p>${link(maps('Lungarno Mediceo Pisa'),t('maps'))}</article></div></section>
<section class="section page-section" id="airport" hidden><button class="btn back" data-section="home">← Home</button><div class="story-card"><div class="eyebrow">✈️ GALILEO GALILEI AIRPORT · PISA</div><h2>${navText('airport')}</h2><p><strong>Pisa Paradiso Nice View</strong> · Lungarno Mediceo 23, Pisa.</p><h3>🚕 Taxi — la soluzione più semplice</h3><p>All’uscita dell’aeroporto puoi prendere un taxi direttamente verso l’appartamento. Per prenotazioni e informazioni: <strong>Co.Ta.Pi. 050 541600</strong>.</p><div class="quick"><a class="btn primary" href="tel:+39050541600">📞 050 541600</a>${link('https://www.cotapi.it/','🚕 Co.Ta.Pi.')}${link(route('Lungarno Mediceo 23, Pisa'),'📍 Percorso dall’aeroporto')}</div><h3>🚝 PisaMover + taxi / passeggiata</h3><p>Il <strong>PisaMover</strong> collega l’Aeroporto Galileo Galilei con Pisa Centrale. Il servizio ufficiale indica un tempo medio di circa <strong>5 minuti</strong> tra aeroporto e stazione, con fermata intermedia a San Giusto/Aurelia. Dalla stazione puoi proseguire in taxi oppure raggiungere l’appartamento a piedi.</p><div class="quick">${link('https://pisa-mover.com/','🚝 Sito ufficiale PisaMover')}${link('https://pisa-mover.com/en/shuttle-service/','🕐 Orari e biglietti')}</div><p class="note">Orari e tariffe possono cambiare: verifica sempre il sito ufficiale prima del viaggio.</p><div class="quick">${link(maps('Pisa Paradiso Nice View, Lungarno Mediceo 23, Pisa'),'📍 Apri la destinazione in Google Maps')}</div></div></section>
<section class="section page-section" id="car" hidden><button class="btn back" data-section="home">← Home</button><div class="story-card"><div class="eyebrow">🚘 ARRIVO A PISA</div><h2>${navText('car')}</h2><p><strong>Destinazione:</strong> Lungarno Mediceo 23, Pisa.</p><h3>📍 Navigazione diretta</h3><p>Il modo più semplice è aprire Google Maps e impostare <strong>Lungarno Mediceo 23, Pisa</strong> come destinazione dalla tua posizione.</p><div class="quick">${link(route('Lungarno Mediceo 23, Pisa'),'📍 Naviga verso Pisa Paradiso Nice View')}${link(maps('Lungarno Mediceo 23, Pisa'),'🗺️ Vedi la posizione')}</div><h3>🧳 Arrivo e scarico bagagli</h3><p>Organizza lo scarico dei bagagli secondo la segnaletica e le condizioni di accesso presenti quel giorno. <strong>Non entrare nelle aree ZTL senza aver verificato le regole di accesso.</strong></p><h3>🅿️ Dopo lo scarico</h3><p>Consulta la sezione <strong>Parcheggi</strong> per SABA Vittorio Emanuele II, Lungarno Guadalongo e le strisce blu sui Lungarni.</p><div class="quick"><button class="btn primary" data-section="parking-info">🅿️ Vai ai parcheggi</button><button class="btn" data-section="ztl">🚫 Controlla la ZTL</button></div><h3>🛣️ Da Firenze, Livorno o altre città</h3><p>Il percorso preciso dipende dal punto di partenza e dal traffico. Il pulsante di navigazione sopra apre un percorso aggiornato fino all’indirizzo dell’appartamento.</p></div></section>
<section class="section page-section" id="taxi" hidden><button class="btn back" data-section="home">← Home</button><div class="ticket-card"><div class="eyebrow">Co.Ta.Pi. · RADIOTAXI PISA</div><h2>${navText('taxi')}</h2><p>Puoi prenotare un taxi online, telefonicamente o tramite i servizi Co.Ta.Pi.</p><div class="quick"><a class="btn primary" href="https://www.cotapi.it/" target="_blank" rel="noopener">🚕 Co.Ta.Pi.</a><a class="btn" href="tel:+39050541600">📞 050 541600</a><a class="btn" href="https://www.cotapi.it/i-nostri-servizi/webi-cotapi" target="_blank" rel="noopener">🌐 Prenotazione online</a><a class="btn" href="https://www.cotapi.it/i-nostri-servizi/taxi-message" target="_blank" rel="noopener">💬 Taxi Message</a></div><p class="note">Per la prenotazione indica città, via e numero civico. Verifica sempre condizioni e disponibilità sul sito ufficiale.</p></div></section>
<section class="section page-section" id="tickets" hidden><button class="btn back" data-section="home">← Home</button><div class="eyebrow">🎟️ PISA</div><h2>${navText('tickets')}</h2><p class="note">Acquista o verifica i biglietti sui siti ufficiali prima della visita.</p><div class="visual-grid"><article class="ticket-card"><h3>🗼 Torre di Pisa e Piazza dei Miracoli</h3><p>Biglietti e informazioni ufficiali dell'Opera della Primaziale Pisana.</p>${link('https://www.opapisa.it/visita/','🎟️ Biglietti ufficiali')}</article><article class="ticket-card"><h3>🏛️ Musei</h3><p>Per i musei, apri la scheda del museo e utilizza il relativo sito ufficiale.</p>${link('https://www.turismo.pisa.it/','🌐 Turismo Pisa')}</article><article class="ticket-card"><h3>🎫 Altri monumenti</h3><p>Informazioni e collegamenti per organizzare la visita dei principali luoghi di Pisa.</p>${link('https://www.turismo.pisa.it/','🌐 Guida ufficiale')}</article></div></section>
<section class="section page-section" id="transport" hidden><button class="btn back" data-section="home">← Home</button><div class="eyebrow">🚆🚌 MOBILITÀ</div><h2>${navText('transport')}</h2><p class="note">Scegli il mezzo, verifica orari e acquista il titolo di viaggio sul sito ufficiale.</p><div class="visual-grid"><article class="ticket-card"><h3>🚆 Treno</h3><p>Orari, collegamenti e acquisto biglietti ferroviari.</p>${link('https://www.trenitalia.com/','🎟️ Trenitalia')}</article><article class="ticket-card"><h3>🚌 Autobus</h3><p>Per il trasporto pubblico locale in Toscana, verifica linee, orari e titoli di viaggio.</p>${link('https://www.at-bus.it/','🎟️ Autolinee Toscane')}</article></div></section>
<section class="section page-section" id="house" hidden><button class="btn back" data-section="home">← Home</button><div class="story-card"><div class="eyebrow">PISA PARADISO NICE VIEW</div><h2>${navText('house')}</h2><p>${esc(storyText('house'))}</p><details><summary>${navText('saffi')}</summary><p>${esc(storyText('saffi'))}</p></details><details><summary>${navText('yambo')}</summary><p>${esc(storyText('yambo'))}</p></details></div></section>
<section class="section page-section" id="saffi" hidden><button class="btn back" data-section="home">← Home</button><div class="story-card"><h2>${navText('saffi')}</h2><p>${esc(storyText('saffi'))}</p><p class="price-note">La biografia generale è verificabile tramite fonti storiche; il soggiorno nella casa è riportato dalla proprietà.</p>${link('https://www.treccani.it/enciclopedia/aurelio-saffi/','Biografia Treccani')}</div></section>
<section class="section page-section" id="yambo" hidden><button class="btn back" data-section="home">← Home</button><div class="story-card"><h2>${navText('yambo')}</h2><p>${esc(storyText('yambo'))}</p><p class="price-note">La nascita a Pisa è documentata; la nascita nell'appartamento è indicata dalla storia della proprietà.</p>${link('https://www.treccani.it/enciclopedia/enrico-novelli_%28Dizionario-Biografico%29/','Biografia Treccani')}</div></section>
<section class="section page-section" id="events" hidden><button class="btn back" data-section="home">← Home</button><h2>${navText('events')}</h2><div class="ticket-card"><p>Consulta gli eventi aggiornati del Comune e del turismo di Pisa.</p>${link('https://www.turismo.pisa.it/eventi/index.html','🇮🇹 Eventi Pisa')}${link('https://www.turismo.pisa.it/en/events','🇬🇧 Pisa events')}</div></section>
<section class="section page-section" id="ztl" hidden><button class="btn back" data-section="home">← Home</button><h2>${navText('ztl')}</h2><div class="ticket-card"><p>Prima di entrare in centro con l'auto, verifica sempre le fasce orarie e le regole di accesso alla ZTL.</p>${link('https://www.comune.pisa.it/it/ufficio/ztl','🌐 Comune di Pisa')}</div></section>
<section class="section page-section" id="useful" hidden><button class="btn back" data-section="home">← Home</button><h2>${navText('useful')}</h2><div class="visual-grid"><article class="ticket-card"><h3>🚨 112</h3><p>Numero unico europeo per le emergenze.</p></article><article class="ticket-card"><h3>🚕 Co.Ta.Pi.</h3><p>RadioTaxi Pisa: 050 541600.</p>${link('https://www.cotapi.it/','Co.Ta.Pi.')}</article><article class="ticket-card"><h3>🏛️ Turismo Pisa</h3><p>Informazioni turistiche ed eventi.</p>${link('https://www.turismo.pisa.it/','Turismo Pisa')}</article></div></section>`;renderCards();const wanted=(location.hash||'#home').slice(1);showSection(document.getElementById(wanted)?wanted:'home')}
function openPlace(id,show=true){const p=PLACES.find(p=>p.id===id);if(!p)return;active=id;$('#detail').innerHTML=`<button class="close" data-action="close">${t('close')} ×</button><span class="pill">${t(p.category)}</span><h2>${esc(p.name)}</h2><p id="narration">${esc(p.description[lang])}</p><p class="note">${t('check')}</p><div class="actions">${link(maps(p.query),t('maps'))}${link(route(p.query),t('directions'))}${link(p.site,t('website'))}</div><hr>${audio()}${p.images.length?`<div class="gallery">${p.images.map(src=>`<img loading="lazy" src="${esc(src)}" alt="${esc(p.name)}">`).join('')}</div>`:''}${p.video?link(p.video,'▶ Video'):''}`;if(show&&!$('#detail').open)$('#detail').showModal()}
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){category=f.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',b===f));renderCards()}const p=e.target.closest('[data-place]');if(p)openPlace(p.dataset.place);const sec=e.target.closest('[data-section]');if(sec){e.preventDefault();const id=sec.dataset.section;showSection(id);$('#nav').hidden=true;$('#menu').setAttribute('aria-expanded','false')}const a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='close')$('#detail').close();if(a.dataset.action==='listen')speak($('#narration').textContent);if(a.dataset.action==='stop')stop();if(a.dataset.action==='pause'&&'speechSynthesis'in window){speechSynthesis.paused?speechSynthesis.resume():speechSynthesis.pause()}}});
$('#menu').addEventListener('click',()=>{$('#nav').hidden=!$('#nav').hidden;$('#menu').setAttribute('aria-expanded',String(!$('#nav').hidden))});window.addEventListener('hashchange',()=>{const id=(location.hash||'#home').slice(1);if(document.getElementById(id))showSection(id)});$('#language').addEventListener('change',e=>{stop();lang=e.target.value;try{localStorage.setItem('pisa-language',lang)}catch(e){}render()});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;renderCards()}});$('#detail').addEventListener('close',()=>{active=null;stop()});window.addEventListener('pagehide',stop);render();
</script></body></html>
